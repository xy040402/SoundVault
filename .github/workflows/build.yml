name: build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 还原
        run: dotnet restore src/SoundVault.App/SoundVault.App.csproj

      - name: 断言测试
        run: dotnet run --project tests/SoundVault.Tests -c Release

      - name: 发布单文件 exe
        run: |
          dotnet publish src/SoundVault.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.0.0 -o dist
          Copy-Item dist/SoundVault.App.exe dist/音匣.exe -Force

      - name: 发布安装包
        run: |
          dotnet publish src/SoundVault.Setup -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.0.0 -o dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SoundVault-win-x64
          path: |
            dist/音匣.exe
            dist/音匣安装包.exe
          if-no-files-found: error
